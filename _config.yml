title: MIT 6.1810 学习笔记
description: xv6 / RISC-V 操作系统课程(Fall 2026)自学笔记、环境搭建与速查表
lang: zh-CN

# GitHub Pages 原生支持 remote_theme,无需 CI 构建
remote_theme: just-the-docs/just-the-docs@v0.12.0
baseurl: "/learn-mit-6.1810"

plugins:
  - jekyll-remote-theme

# ---- Just the Docs ----
color_scheme: dark
search_enabled: true
search:
  heading_level: 3
  previews: 2
heading_anchors: true

callouts_level: quiet
callouts:
  warning:
    title: 注意
    color: red
  gotcha:
    title: 坑
    color: yellow
  note:
    title: 说明
    color: blue
  tip:
    title: 提示
    color: green

aux_links:
  "课程主页 ↗":
    - "https://pdos.csail.mit.edu/6.1810/2026/"
  "xv6 book ↗":
    - "https://pdos.csail.mit.edu/6.1810/2026/xv6/book-riscv-rev4.pdf"
aux_links_new_tab: true

footer_content: >-
  自学笔记,非 MIT 官方内容。课程材料版权归 MIT PDOS 所有。
  Lab 解答代码默认折叠,请勿直接抄作业。

# 代码块 & Markdown
markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

exclude:
  - xv6-labs-2025/
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .jekyll-cache/
